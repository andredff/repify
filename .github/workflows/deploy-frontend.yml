name: Build & Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'tailwind.config.*'
      - 'postcss.config.*'
      - 'ngsw-config.json'
      - '.github/workflows/deploy-frontend.yml'
      - '.github/deploy/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production
        run: npm run build

      - name: Prepare deploy directory
        run: |
          mkdir -p deploy-tmp
          cp -r dist/repify/browser/. deploy-tmp/

          # A branch "production" contem APENAS o build pronto (sem package.json).
          # Sem este vercel.json a Vercel cai nas configuracoes do dashboard e tenta
          # rodar "ng build", que falha com "ng: command not found" (exit 127).
          # buildCommand/installCommand vazios = servir os arquivos como estao.
          # Tambem garante o rewrite de SPA: o _redirects e sintaxe Netlify/Render
          # e a Vercel o ignora, entao deep links (/feed, /ranking) dariam 404.
          cp .github/deploy/vercel.json deploy-tmp/vercel.json

      - name: Deploy to production branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-tmp
          publish_branch: production
          force_orphan: true
          commit_message: "build: ${{ github.sha }}"
